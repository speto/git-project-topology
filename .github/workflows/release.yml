name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release tag
        run: npm run verify:release-tag -- "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Check
        run: npm run check
      - name: Pack and verify consumer artifact
        run: npm run verify:package -- --keep
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          package_file="git-project-topology-${version}.tgz"

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
          gh release upload "$GITHUB_REF_NAME" "$package_file"
          gh release edit "$GITHUB_REF_NAME" --draft=false
